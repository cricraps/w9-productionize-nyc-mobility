name: Test Branch Before PR

on:
  push:
    branches:
      - testing  # Triggers every time you push code to the 'testing' branch

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Packages the traffic-advisory scrape needs (see README "How to Run")
          pip install requests beautifulsoup4
          # Lint/test tooling
          pip install flake8 black nbformat

      - name: Check Python syntax (src/01_raw/*.py)
        run: |
          python -m py_compile src/01_raw/*.py

      - name: Check formatting with black
        run: black --check src/01_raw

      - name: Validate notebooks aren't corrupted
        run: |
          python - <<'EOF'
          import glob, sys, nbformat

          bad = []
          for path in glob.glob("src/**/*.ipynb", recursive=True):
              try:
                  nbformat.read(path, as_version=4)
              except Exception as e:
                  bad.append((path, str(e)))

          if bad:
              for path, err in bad:
                  print(f"::error file={path}::Invalid notebook: {err}")
              sys.exit(1)
          print(f"Checked {len(glob.glob('src/**/*.ipynb', recursive=True))} notebook(s) — all valid.")
          EOF

      - name: Check for accidentally committed secrets
        run: |
          # README forbids committing tokens/API keys/credentials — fail fast
          # if anything that looks like one shows up in this push.
          if grep -rEn "dapi[a-f0-9]{32}|AKIA[0-9A-Z]{16}" --include="*.py" --include="*.ipynb" .; then
            echo "::error::Possible credential found in committed files — see README Security section."
            exit 1
          fi
          echo "No obvious credentials found."
