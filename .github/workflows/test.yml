name: Test Branch Before PR

on:
  push:
    branches:
      - testing  # Triggers every time you push code to the 'testing' branch

jobs:
  run-tests:
    runs-size: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test
